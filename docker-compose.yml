services:
  mirrorpilot:
    # GHCR image paths must be lowercase, even though the GitHub account
    # name is cased differently.
    image: ghcr.io/dc1024/mirrorpilot:latest
    container_name: mirrorpilot

    ports:
      # WARNING: this panel stores credentials for your GitHub and Alibaba Cloud
      # accounts. Do not publish it to the internet. Keep it on your LAN, or
      # front it with a reverse proxy that terminates TLS and adds auth.
      - "8080:8080"

    volumes:
      # Everything persistent: the config file and the SQLite database, which
      # holds the account, the sessions, and the encrypted credentials.
      # Backing up is copying this one directory.
      - ./data:/data

    environment:
      - TZ=Asia/Shanghai
      - MIRRORPILOT_BIND=0.0.0.0:8080
      - MIRRORPILOT_DATA=/data

      # Uncomment when a reverse proxy terminates TLS in front of the panel,
      # and put your real hostname here. It is what makes the panel mark its
      # cookies Secure. Leave it unset for plain-HTTP access on a LAN: a Secure
      # cookie is never sent over HTTP, so logging in would silently fail.
      # - MIRRORPILOT_BASE_URL=https://mirrorpilot.example.com

    # Defence in depth, and free: the process already runs as uid 10001 (see the
    # Dockerfile), so there is nothing for it to escalate to. What this closes
    # is the route — a setuid binary or a file capability in the image would be
    # one, and nothing here needs either. It also means a future base image that
    # ships one by accident cannot quietly hand the panel more rights than this
    # file grants it.
    security_opt:
      - no-new-privileges:true

    # Dropping every capability is free too, and it is measured rather than
    # assumed. With cap_drop: [ALL] the process starts with CapEff, CapPrm and
    # CapBnd all 0x0, completes setup (password hashing, session, the first
    # SQLite WAL write), serves the dashboard, and stays healthy with zero
    # restarts. Nothing in the binary needs a capability: it binds 8080, above
    # the privileged range; it opens no raw sockets; and it runs as a non-root
    # uid that never calls setuid.
    #
    # Measured on 2026-10-25 against the image built from 6e13bdc, Docker
    # 29.7.2, on a host where the data directory was already owned by 10001.
    # If a future change does need a capability, the container fails loudly at
    # start instead of quietly degrading, and the fix is to add that one back
    # with cap_add rather than to delete these lines.
    cap_drop:
      - ALL

    restart: unless-stopped
