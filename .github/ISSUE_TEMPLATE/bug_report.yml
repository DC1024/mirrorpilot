name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: please confirm you are on the latest release and that the problem
        is not a known-failing mirror (mirrors do go down — that is expected).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Mirrors page
        2. Click "Test all"
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MirrorPilot version
      description: Shown in the panel footer, or the image tag you pulled.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Architecture
      options:
        - linux/amd64
        - linux/arm64
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Container logs. **Remove any tokens, passwords, or registry credentials before pasting.**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: redacted
    attributes:
      label: Confirmation
      options:
        - label: I have removed all secrets and credentials from the logs above
          required: true
