name: Feature request
description: Suggest a capability that MirrorPilot does not have yet
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We keep the scope deliberately narrow. MirrorPilot measures mirrors and relocates
        images — it is **not** a registry proxy and will not become one by default.
        Requests that turn it into a proxy belong in the "relay mode" discussion instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including doing nothing, or solving it outside this project.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch
      options:
        - Mirror list / probing
        - Config generation
        - GitHub Actions relocation
        - Relay mode
        - UI / i18n / theming
        - Security / credentials
        - Packaging / deployment
    validations:
      required: true
