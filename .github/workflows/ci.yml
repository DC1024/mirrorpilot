name: CI

# Every third-party `uses:` below is pinned to a commit SHA, with the version in
# a trailing comment. A tag like @v4 is a moving pointer: whoever owns the action
# can retarget it, and the workflow that runs tomorrow is then not the one that
# ran when the tag was read. Dependabot (.github/dependabot.yml) moves these pins
# weekly, rewriting the SHA and the comment together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release pipeline can gate publishing on these checks
  # instead of running beside them. See release.yml.
  workflow_call:
  # Advisories are published against code that has not changed. Pushing is not
  # what makes a dependency vulnerable, so waiting for the next push means a
  # library that turns dangerous in March goes unreported until someone happens
  # to touch the repository. This runs whether or not anyone is working.
  #
  # Monday 06:00 UTC, before the week starts, so a finding is waiting rather
  # than arriving mid-afternoon. Scheduled runs only fire on the default branch.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Two pushes in quick succession start two runs over the same ref. Neither
# knows the other exists, so both run to completion, and the older commit's
# result can land last — which is the one people read in the commit list.
# Grouping plus cancel-in-progress turns a superseded run into a cancelled one
# instead of a late verdict on code that has already been replaced.
#
# Every part of the group key is load-bearing. The static prefix and
# github.workflow together keep this group apart from the one release.yml
# declares: a called workflow sees the *caller's* name in github.workflow, so
# the gate release.yml runs here lands in "ci-Release-…" while the standalone
# run for the same push lands in "ci-CI-…". They must differ — both are started
# by that one push, and a shared group would let one cancel the other, with a
# cancelled gate failing the release. GitHub documents this exact trap under
# "Reusing workflow configurations"; do not "simplify" the key.
#
# event_name is there for the schedule above. A scheduled run sits on the same
# ref as every push, so without it the Monday run would cancel whatever build
# happened to be in flight, and a push landing at 05:59 would cancel the
# security scan instead. Two runs only belong in one group when the newer one
# genuinely supersedes the older, and a cron run supersedes nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below carries an explicit timeout. The default is 360 minutes, which
# is less a limit than the absence of one: a run wedged on a hung `go install`,
# a stalled module download or a registry that stopped answering sits there for
# six hours before anything reports it.
#
# The numbers are sized against what these jobs actually cost — the slowest
# Test & vet run on record took 268s — with room for a cold cache, not for a
# regression. They are a hung-run detector, not a performance budget.
#
# This got more important, not less, when the concurrency group above landed:
# with cancel-in-progress off on the release pipeline, a wedged run no longer
# just wastes minutes, it holds the queue for that ref and every later push sits
# behind it.
jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      # go.mod and go.sum are source too, and they drift silently: a `go get` to
      # try something out, an import deleted without a tidy, a require marked
      # // indirect that no longer is. None of that fails a build — it just
      # leaves the dependency list describing a tree that no longer exists.
      #
      # -diff reports what is stale and exits non-zero without writing to the
      # tree, so a red run shows exactly the lines to apply instead of leaving a
      # dirty checkout for the next step.
      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # go vet only reports what the compiler can prove. staticcheck covers the
      # classes of mistake that are perfectly legal Go: a comparison that is
      # constant false, a Printf verb that does not match its argument, code
      # that cannot be reached. It already found one of the first kind here.
      #
      # Pinned, because an unpinned linter turns "a new release came out" into
      # "main is red". Bump this deliberately, in its own commit.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          "$(go env GOPATH)/bin/staticcheck" -checks=all ./...

      # The race detector is a correctness check, not a measuring instrument,
      # so the two runs are kept apart: a test suite measured under a different
      # build is a number that is harder to compare with the one a developer
      # gets from `go test -cover ./...`.
      - name: Test (race)
        run: go test -race ./...

      - name: Coverage
        run: go test -covermode=set -coverprofile=coverage.out ./...

      # Uploaded before the floor is judged, and even when an earlier step
      # failed: a red build is exactly the moment someone wants the profile to
      # see what moved.
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

      # A number that is computed and then thrown away is not a check.
      #
      # 80.0% is 2.1 points under what this tree measures on CI. That margin is
      # wider than it looks, because the measurement is not portable across Go
      # patch releases: go1.27.0 instruments 4468 statements for this tree and
      # reports 86.6%, while go1.27.3 instruments 3090 and reports 82.1% — with
      # the same source and the same tests. The instrumented shape changed, not
      # the coverage.
      #
      # setup-go follows go.mod's `go 1.27` to the newest patch, and that is the
      # right behaviour, because a patch release is where standard-library fixes
      # arrive. The consequence is that this threshold is tied to the toolchain:
      # re-measure on CI before changing it, and never lower it to go green.
      - name: Coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $NF); print $NF }')"
          if [ -z "$total" ]; then
            echo "the profile has no total line"
            exit 1
          fi
          echo "total coverage: ${total}%"
          echo "Total coverage: **${total}%** (floor 80.0%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t + 0 < 80.0) { print "coverage fell below the 80.0% floor"; exit 1 } }'

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Generous relative to the ~31s it costs, because a cold run has to fetch the
    # vulnerability database, and that download is the part that hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Logged because the answer depends on it. Findings in this project are
      # mostly in the standard library, and those are fixed by a patch release
      # of the toolchain — a red run without the version next to it is not
      # reproducible.
      - name: Go toolchain
        run: go version

      # Reports the vulnerabilities this code can actually reach, not every
      # advisory against anything in go.sum: an advisory for a package behind
      # an unused build tag is not a reason to hold a release. Pinned for the
      # same reason as staticcheck.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  build-multiarch:
    name: Multi-arch image build
    runs-on: ubuntu-latest
    # Emulated arm64 is the slowest thing here and the least predictable: with a
    # warm cache it is ~112s, from cold it is a different job. 30 minutes still
    # catches a hang long before the default six hours would.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  i18n-check:
    name: i18n key parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check locale files have identical key sets
        run: go test ./internal/i18n/ -run 'TestKeyParity|TestPlaceholdersAgree|TestNoEmptyValues' -v

  # Nothing else in this pipeline reads the workflow files themselves. A typo in
  # a key name, or an expression naming a property that github does not have, is
  # valid YAML: the file parses, the run is accepted, and the mistake surfaces
  # only when GitHub rejects the workflow — or worse, is silently ignored and the
  # pipeline does what it would have done anyway.
  #
  # One of those has already happened here: a key ended up inside a run block and
  # bash reported `command not found` at the very end of the run. The other was
  # avoided only by reading the docs first — timeout-minutes on the gate job in
  # release.yml is a schema error, not a stricter limit, and this linter names it.
  #
  # actionlint resolves every ${{ }} against the contexts actually available at
  # that position, checks the key set each kind of job may use, and lints the
  # scripts in run blocks whenever shellcheck is on the runner — it is on
  # ubuntu-latest. Pinned for the same reason as staticcheck: a linter that
  # updates itself turns somebody else's release into a red main.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      # actionlint validates what a workflow says, not which revision of an
      # action it names. A `@v4` is a moving pointer: the owner can retarget it
      # and tomorrow's run is not the one that was reviewed. Every third-party
      # action here is pinned to a commit SHA, and this is what keeps a new step
      # from quietly reintroducing a tag — the pins themselves would stay correct
      # while the rule that makes them worth having eroded one step at a time.
      - name: Actions are pinned to a commit SHA
        run: |
          floating="$(grep -rnE --include='*.yml' '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^#]*@v[0-9]' .github/workflows/ || true)"
          if [ -n "$floating" ]; then
            echo "these actions are on a floating tag; pin them to a commit SHA:"
            echo "$floating"
            exit 1
          fi
          echo "every third-party action is pinned to a commit SHA"
