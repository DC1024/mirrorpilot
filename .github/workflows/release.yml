name: Release

# Every third-party `uses:` below is pinned to a commit SHA, with the version in
# a trailing comment. A tag like @v4 is a moving pointer: whoever owns the action
# can retarget it, and the workflow that runs tomorrow is then not the one that
# ran when the tag was read. Dependabot (.github/dependabot.yml) moves these pins
# weekly, rewriting the SHA and the comment together.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Nothing here needs write access by default. Each job below asks for exactly
# what it publishes and nothing else: declaring any permission sets every
# permission not listed to none, so a job's list is its whole budget rather
# than an addition to this one.
#
# Worth tightening because this workflow runs on every push to main. While both
# scopes sat up here, the job that runs the test suite held contents: write and
# packages: write — enough to rewrite the repository or overwrite :latest from
# a step whose only job was to read it.
permissions:
  contents: read

# Publishing is serialised per ref, and never cancelled.
#
# Until this group existed, runs overlapped freely: on 2026-09-22T00:20:52Z
# three runs (#25, #26, #27) were alive at the same second, and #34/#35 started
# 39 seconds apart. Overlapping runs are only actually wrong when they publish
# the same tag, and the one tag two builds can fight over is :latest, which two
# pushes to the same branch both produce. Whichever run finishes last writes it,
# so :latest could end up pointing at the older commit.
#
# Scope is therefore the ref, not the repository. A tag build does not publish
# :latest at all — metadata-action gates that tag on is_default_branch — so a
# batch tag push is three concurrent runs by design, and serialising them would
# buy nothing but latency.
#
# cancel-in-progress stays false on purpose. Killing a run while it is writing a
# manifest leaves the tag half-pushed; queueing costs a wait, cancelling costs a
# broken :latest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published until the checks in ci.yml pass.
  #
  # Without this job the image workflow runs *beside* CI rather than after it:
  # both trigger on a push to main, so a commit whose tests fail still lands on
  # :latest, and pulling :latest is how a user finds out. Running the checks a
  # second time is the price of that guarantee, and it is a cheap one next to
  # shipping an image nobody verified.
  #
  # No timeout-minutes here on purpose: a job that calls a reusable workflow may
  # only use a fixed set of keys, and timeout-minutes is not one of them. The
  # jobs this gate runs carry their own limits in ci.yml.
  #
  # It inherits contents: read and asks for nothing else, which is exactly what
  # ci.yml declares, so the two agree instead of one silently widening the other.
  test:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish multi-arch image to GHCR
    needs: test
    runs-on: ubuntu-latest
    # packages: write for the push. Not contents: write, because building and
    # publishing an image is no reason to be able to rewrite the repository.
    # The gha build cache does not need a scope here: it authenticates with the
    # runtime token, and ci.yml's cache-warming job proves that — it has only
    # ever had contents: read.
    permissions:
      contents: read
      packages: write
    # The build is the same work ci.yml already did, plus QEMU plus a push to
    # GHCR, so it is bounded the same way: ~2 minutes warm, with room for the
    # registry to be slow rather than absent.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR rejects uppercase repository paths, and this account is "DC1024".
      # Derive the name from the repository instead of hardcoding it, so a fork
      # publishes to its own namespace — but lowercase it first.
      - name: Resolve image name and build metadata
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

  # Only meaningful for an actual tag. A push to main publishes an image, not a
  # release — running this there would fail on a missing tag.
  release-notes:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: image
    # The only job that needs to write to the repository, because creating a
    # release is a write. It does not need packages: write to do it.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
