name: Release

# Every third-party `uses:` below is pinned to a commit SHA, with the version in
# a trailing comment. A tag like @v4 is a moving pointer: whoever owns the action
# can retarget it, and the workflow that runs tomorrow is then not the one that
# ran when the tag was read. Dependabot (.github/dependabot.yml) moves these pins
# weekly, rewriting the SHA and the comment together.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Nothing here needs write access by default. Each job below asks for exactly
# what it publishes and nothing else: declaring any permission sets every
# permission not listed to none, so a job's list is its whole budget rather
# than an addition to this one.
#
# Worth tightening because this workflow runs on every push to main. While both
# scopes sat up here, the job that runs the test suite held contents: write and
# packages: write — enough to rewrite the repository or overwrite :latest from
# a step whose only job was to read it.
permissions:
  contents: read

# Publishing is serialised per ref, and never cancelled.
#
# Until this group existed, runs overlapped freely: on 2026-09-22T00:20:52Z
# three runs (#25, #26, #27) were alive at the same second, and #34/#35 started
# 39 seconds apart. Overlapping runs are only actually wrong when they publish
# the same tag, and the one tag two builds can fight over is :latest, which two
# pushes to the same branch both produce. Whichever run finishes last writes it,
# so :latest could end up pointing at the older commit.
#
# Scope is therefore the ref, not the repository. A tag build publishes only
# 1.2.3 and 1.2 — the latest and sha rules are both gated on
# `github.ref_type != 'tag'` further down — so a batch tag push is three
# concurrent runs that write three different tags, and serialising them would
# buy nothing but latency.
#
# That is only true while both gates hold. When this comment was first written
# the latest gate read `enable={{is_default_branch}}`, which did not take
# effect: the v0.4.0 tag build published :latest anyway. Per-ref groups plus a
# broken latest gate is the worst combination available — three concurrent
# runs, all writing :latest, and the last one to finish decides what users pull.
# If the gates are ever loosened, this group has to become per-repository.
#
# cancel-in-progress stays false on purpose. Killing a run while it is writing a
# manifest leaves the tag half-pushed; queueing costs a wait, cancelling costs a
# broken :latest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published until the checks in ci.yml pass.
  #
  # Without this job the image workflow runs *beside* CI rather than after it:
  # both trigger on a push to main, so a commit whose tests fail still lands on
  # :latest, and pulling :latest is how a user finds out. Running the checks a
  # second time is the price of that guarantee, and it is a cheap one next to
  # shipping an image nobody verified.
  #
  # No timeout-minutes here on purpose: a job that calls a reusable workflow may
  # only use a fixed set of keys, and timeout-minutes is not one of them. The
  # jobs this gate runs carry their own limits in ci.yml.
  #
  # It inherits contents: read and asks for nothing else, which is exactly what
  # ci.yml declares, so the two agree instead of one silently widening the other.
  test:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish multi-arch image to GHCR
    needs: test
    runs-on: ubuntu-latest
    # packages: write for the push. Not contents: write, because building and
    # publishing an image is no reason to be able to rewrite the repository.
    # The gha build cache does not need a scope here: it authenticates with the
    # runtime token, and ci.yml's cache-warming job proves that — it has only
    # ever had contents: read.
    permissions:
      contents: read
      packages: write
    # The build is the same work ci.yml already did, plus QEMU plus a push to
    # GHCR, so it is bounded the same way: ~2 minutes warm, with room for the
    # registry to be slow rather than absent.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # GHCR rejects uppercase repository paths, and this account is "DC1024".
      # Derive the name from the repository instead of hardcoding it, so a fork
      # publishes to its own namespace — but lowercase it first.
      - name: Resolve image name and build metadata
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # A commit gets built twice here: once when it lands on main, and again
          # if it is also tagged. Both builds used to publish sha-<short>, and
          # the two images are not the same — main.Version is "main" in one and
          # "v1.2.3" in the other, so /api/health reports whichever build pushed
          # last. Runs #34 and #35 did exactly that, 39 seconds apart.
          #
          # The sha tag therefore belongs to the branch build alone. A tag build
          # is already identified by 1.2.3 and 1.2, which are the names someone
          # deploying a specific version will use; a second name for the same
          # build buys nothing and is the one that collides.
          #
          # This fixes the next tag build, not the past: any sha- tag that was
          # overwritten stays overwritten until that commit is rebuilt.
          #
          # latest belongs to the branch build for the same reason, and it took
          # the v0.4.0 tag to notice it was not doing that. The rule used to
          # read `enable={{is_default_branch}}`, which is the form the action's
          # README shows — but on that tag build the handlebars expression came
          # through unrendered (the log keeps `enable={{is_default_branch}}`
          # with priority=200 still attached) and :latest was pushed anyway,
          # moving it from the main build to the tag build of the same commit.
          # github.ref_type is a plain GitHub expression, evaluated before the
          # action ever sees it: the same run rendered the sha rule as
          # `enable=false`, and that is the evidence this line stands on.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' }}
            type=sha,format=short,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

  # Only meaningful for an actual tag. A push to main publishes an image, not a
  # release — running this there would fail on a missing tag.
  release-notes:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: image
    # The only job that needs to write to the repository, because creating a
    # release is a write. It does not need packages: write to do it.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Take the body from the tag message
        # The tag message is where a human writes down what changed, and until
        # now it was thrown away. v0.4.0's release page came out at 81 bytes —
        # a compare link and nothing else — because GitHub's generator lists
        # merged pull requests, and this repository commits straight to main,
        # so there were none to list.
        #
        # A lightweight tag has no message to take. Checking that the file is
        # non-empty is not enough: `%(contents)` falls back to the commit
        # message for a lightweight tag, so it would quietly publish the last
        # commit's subject as the release notes. Ask what the ref points at
        # instead. Failing here only skips the page — the image is published
        # by now — and an empty page is worse than a red job.
        run: |
          kind="$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")"
          if [ "$kind" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a $kind, not an annotated tag; use 'git tag -a' so the release page has something to say"
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-body.md
          echo "release body: $(wc -c < release-body.md) bytes"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # body_path is prepended to the generated notes, so the tag message
          # leads and the compare link still lands at the bottom.
          body_path: release-body.md
          generate_release_notes: true
