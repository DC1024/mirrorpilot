{{define "content"}}
<section class="card">
  <h1>{{ .T "settings.title" }}</h1>
  <p class="lead">{{ .T "settings.subtitle" }}</p>

  {{ template "formerror" . }}

  <form method="post" action="/settings" class="stack">
    {{ template "csrf" . }}

    <fieldset class="group">
      <legend>{{ .T "settings.appearance" }}</legend>

      <label class="field">
        <span class="field-label">{{ .T "settings.language" }}</span>
        <select name="locale">
          {{- range .AvailableLanguages }}
          <option value="{{ .Tag }}"{{ if eq .Tag $.Lang }} selected{{ end }}>{{ .Name }}</option>
          {{- end }}
        </select>
      </label>

      <label class="field">
        <span class="field-label">{{ .T "settings.theme" }}</span>
        <select name="theme">
          {{- range .ThemeOptions }}
          <option value="{{ .Tag }}"{{ if eq .Tag $.Theme }} selected{{ end }}>{{ $.T .LabelKey }}</option>
          {{- end }}
        </select>
      </label>
    </fieldset>

    {{ with .SettingsPage }}
    <fieldset class="group">
      <legend>{{ $.T "settings.probe" }}</legend>

      <label class="field">
        <span class="field-label">{{ $.T "settings.probe_repository" }}</span>
        <input name="probe_repository" type="text" value="{{ .ProbeRepository }}"
               placeholder="{{ .ProbeDefault.Repository }}" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span class="field-label">{{ $.T "settings.probe_reference" }}</span>
        <input name="probe_reference" type="text" value="{{ .ProbeReference }}"
               placeholder="{{ .ProbeDefault.Reference }}" autocomplete="off" spellcheck="false">
        <span class="field-hint">{{ $.T "settings.probe_reference_hint" }}</span>
      </label>

      <p class="field-hint">{{ $.T "settings.probe_hint" }}</p>
    </fieldset>
    {{ end }}

    <button class="btn btn-primary" type="submit">{{ .T "action.save" }}</button>
  </form>
</section>

<section class="card">
  <p><a class="btn" href="/password">{{ .T "password.title" }}</a></p>
</section>
{{end}}
