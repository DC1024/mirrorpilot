{{define "content"}}
<section class="card card-narrow">
  <h1>{{ .T "password.title" }}</h1>
  <p class="lead">{{ .T "password.subtitle" }}</p>

  {{ template "formerror" . }}

  <form method="post" action="/password" class="stack" data-confirm="{{ .T "password.warning" }}">
    {{ template "csrf" . }}

    <label class="field">
      <span class="field-label">{{ .T "password.current" }}</span>
      <input name="current" type="password" autocomplete="current-password" required autofocus>
    </label>

    <label class="field">
      <span class="field-label">{{ .T "password.new" }}</span>
      <input name="new" type="password" autocomplete="new-password" required minlength="{{ .MinPasswordLength }}">
    </label>

    <label class="field">
      <span class="field-label">{{ .T "password.confirm" }}</span>
      <input name="confirm" type="password" autocomplete="new-password" required minlength="{{ .MinPasswordLength }}">
    </label>

    <button class="btn btn-primary" type="submit">{{ .T "password.submit" }}</button>
  </form>

  <p class="note">{{ .T "password.warning" }}</p>
</section>
{{end}}
